name: TimeTrail Content and Gameplay
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
jobs:
  gameplay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check travel-routes.js
          node --check content.js
      - name: Test question bank, routes and gameplay
        run: node --test tests/*.test.cjs
