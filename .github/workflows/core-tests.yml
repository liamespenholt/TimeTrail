name: TimeTrail Core Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  gameplay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Test v0.2 gameplay
        run: node tests/core.test.cjs
